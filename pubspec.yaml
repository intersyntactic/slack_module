name: is_slack_module
description: >
  A Slack adapter for intersyntactic. Mentions and threads in Slack become
  turns of a mission on an intersyntactic agent, with any model the sender
  has credentials for. Follows intersyntactic's "modules live in their own
  repos" shape: this package depends on intersyntactic's public packages,
  not the other way around.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

executables:
  slack-reply-drawing: slack_reply_drawing

dependencies:
  checked_json: ^0.4.1
  is_airlock_api: ^0.26.0
  is_annotation_shapes: ^0.5.0
  is_conversation_vocabulary: ^0.2.0
  is_docking_station_api: ^0.11.0
  is_logbook_client: ^0.4.0
  is_outcome_vocabulary: ^0.1.0
  is_shapes: ^0.6.0
  is_sign_in_vocabulary: ^0.1.2
  is_slack_relay: ^0.7.1
  is_web_address_vocabulary: ^0.1.2
  is_web_request_vocabulary: ^0.1.0

dev_dependencies:
  is_content_id: ^0.2.0
  lints: ^6.1.0
  test: ^1.25.0
